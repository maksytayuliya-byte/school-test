
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест з біології</title>
<style>
body {
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#e5dcff,#f5efff);
padding: 25px;
color: #49365d;
}
.container {
max-width: 650px;
margin: auto;
background: white;
padding: 30px;
border-radius: 20px;
box-shadow: 0 5px 20px #bbb;
}
h1 {text-align:center;color:#8059b5;}
label {display:block;margin-top:15px;font-weight:bold;}
input[type=text] {
width:100%;padding:11px;box-sizing:border-box;
border:1px solid #cbbbe9;border-radius:8px;
}
.question {margin-top:22px;padding:15px;background:#f7f3ff;border-radius:10px;}
.question label {font-weight:normal;margin-top:10px;}
button {
width:100%;padding:14px;margin-top:25px;
background:#8059b5;color:white;border:0;
border-radius:9px;font-size:17px;cursor:pointer;
}
#result {text-align:center;font-weight:bold;margin-top:20px;}
</style>
</head>
<body>
<div class="container">
<h1>🧬 Тест з біології</h1>
<p>Перевір свої знання!</p>

<form id="quiz">
<label>Ім'я та прізвище:</label>
<input type="text" id="student" required>

<div class="question">
<b>1. Яка частина рослини поглинає воду?</b>
<label><input type="radio" name="q1" value="0" required> Листок</label>
<label><input type="radio" name="q1" value="1"> Корінь</label>
<label><input type="radio" name="q1" value="0"> Квітка</label>
</div>

<div class="question">
<b>2. Який газ поглинають рослини під час фотосинтезу?</b>
<label><input type="radio" name="q2" value="1" required> Вуглекислий газ</label>
<label><input type="radio" name="q2" value="0"> Кисень</label>
<label><input type="radio" name="q2" value="0"> Азот</label>
</div>

<div class="question">
<b>3. Який орган перекачує кров?</b>
<label><input type="radio" name="q3" value="0" required> Легені</label>
<label><input type="radio" name="q3" value="1"> Серце</label>
<label><input type="radio" name="q3" value="0"> Шлунок</label>
</div>

<div class="question">
<b>4. Скільки ніг має павук?</b>
<label><input type="radio" name="q4" value="0" required> Шість</label>
<label><input type="radio" name="q4" value="1"> Вісім</label>
<label><input type="radio" name="q4" value="0"> Десять</label>
</div>

<div class="question">
<b>5. Яка тварина є ссавцем?</b>
<label><input type="radio" name="q5" value="1" required> Дельфін</label>
<label><input type="radio" name="q5" value="0"> Акула</label>
<label><input type="radio" name="q5" value="0"> Форель</label>
</div>

<button type="submit">Перевірити відповіді</button>
</form>
<div id="result"></div>
</div>

<script>
document.getElementById("quiz").addEventListener("submit",function(e){
e.preventDefault();
let score=0;
for(let i=1;i<=5;i++){
score+=Number(document.querySelector('input[name="q'+i+'"]:checked').value);
}
document.getElementById("result").textContent=
"Молодець, "+document.getElementById("student").value+
"! Твій результат: "+score+" із 5 балів.";
});
</script>
</body>
</html>
